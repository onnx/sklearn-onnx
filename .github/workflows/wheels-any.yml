name: Build Any Wheel

on:
  push:
    branches:
      - main
      - 'releases/**'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist -v

      - name: install twine
        run: python -m pip install twine

      - name: check wheel
        run: python -m twine check dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-any
          path: dist/*.whl
